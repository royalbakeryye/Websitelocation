<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسافات التوصيل</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14203a;--mut:#64708a;--bd:#e3e8f1;--pr:#0f6fff;--ok:#12a150;--wr:#e8590c;--bar:#9ec1ff;--gold:#f5b301;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1424;--card:#16203a;--tx:#eaf0ff;--mut:#98a5c4;--bd:#25314f;--pr:#4b8dff;--ok:#3ccf7e;--wr:#ff8a4c;--bar:#2c4a85;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,32,58,.05)}
.steps{display:flex;gap:8px;margin-bottom:14px}
.step{flex:1;text-align:center;font-size:12px;color:var(--mut);padding:8px 4px;border-radius:10px;border:1px dashed var(--bd)}
.step.done{color:var(--ok);border:1px solid var(--ok);font-weight:700}.step.cur{color:var(--pr);border:1px solid var(--pr);font-weight:700}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 6px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;margin-top:12px;background:var(--pr)}
.btn:active{transform:scale(.98)}.btn.g{background:var(--ok)}
.btn.s{background:none;color:var(--wr);border:1px solid var(--bd);padding:12px;font-size:14px;font-weight:600;margin-top:0}
.btn[disabled]{opacity:.5}
.msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--bg);display:none}
.msg.err{color:var(--wr);display:block}.msg.ok{color:var(--ok);display:block}
.big{text-align:center}.big b{display:block;font-size:44px;color:var(--pr);line-height:1.1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.range{display:none;gap:10px;margin-bottom:12px}.range.show{display:flex}.range div{flex:1}.range label{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat span{font-size:12px;color:var(--mut)}.stat b{display:block;font-size:22px}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;overflow-x:auto;padding-top:8px}
.col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col i{width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:3px}
.col small{font-size:10px;color:var(--mut);margin-top:4px;white-space:nowrap}.col em{font-size:10px;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .d{font-weight:700;color:var(--pr);font-size:18px;white-space:nowrap}
.row .m{font-size:12px;color:var(--mut)}.row button{border:0;background:none;color:var(--wr);cursor:pointer;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.tools{display:flex;gap:10px}.hide{display:none!important}
.lb{padding:12px 0;border-bottom:1px solid var(--bd)}.lb:last-child{border:0}.lb.me{background:color-mix(in srgb,var(--pr) 10%,transparent);border-radius:12px;padding:12px}
.lbh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:4px}
.bar span{width:70px;flex:none}.bar div{flex:1;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}.bar b{width:62px;flex:none;color:var(--tx);text-align:start}
.link{background:none;border:0;color:var(--pr);font:inherit;cursor:pointer;margin-top:12px;width:100%}
.out{border:1px solid var(--bd);background:none;color:var(--mut);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.badge{background:var(--pr);color:#fff;border-radius:8px;padding:1px 8px;font-size:11px}.badge.off{background:var(--wr)}
.ck{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;color:var(--tx)}.ck input{width:auto}
details summary{padding:4px 0}
.m a{color:var(--pr);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<!-- تسجيل الدخول -->
<section id="auth" class="hide">
  <header><div><h1>🛵 مسافات التوصيل</h1><div class="sub">سجّل الدخول للمتابعة</div></div></header>
  <div class="card">
    <div id="nmBox" class="hide"><label for="nm">الاسم الظاهر في المنافسة</label><input id="nm" type="text" placeholder="مثال: أحمد"></div>
    <label for="un">اسم المستخدم (إنجليزي وأرقام)</label><input id="un" type="text" autocapitalize="none" autocomplete="username" placeholder="ahmed91">
    <label for="pw">كلمة المرور (٦ أحرف على الأقل)</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go">تسجيل الدخول</button>
    <button class="link" id="sw">ليس لدي حساب – إنشاء حساب جديد</button>
    <div class="msg" id="am"></div>
  </div>
</section>

<!-- التطبيق -->
<section id="app" class="hide">
<header><div><h1>🛵 مسافات التوصيل</h1><div class="sub" id="who"></div></div><button class="out" id="out">خروج</button></header>
<div class="tabs"><button id="t1" class="on">التوصيل</button><button id="t2">سجلي</button><button id="t3">🏆 المنافسة</button><button id="t4" class="hide">⚙ الإدارة</button></div>

<section id="v1">
  <div class="steps"><div class="step cur" id="s1">١ المطعم</div><div class="step" id="s2">٢ العميل</div><div class="step" id="s3">٣ تم الحفظ</div></div>
  <div class="card">
    <div id="rnBox"><label for="rn" style="margin-top:0">اسم المطعم (اختياري)</label><input type="text" id="rn" placeholder="مثال: مطعم البيك"></div>
    <button class="btn" id="b1">📍 وصلت للمطعم – حدد موقعي</button>
    <button class="btn g hide" id="b2">🏠 وصلت للعميل – احسب المسافة</button>
    <button class="btn g hide" id="b2b">🏠 وصلت للعميل ٢</button>
    <label class="ck" id="twoBox" style="margin-top:12px"><input type="checkbox" id="two"> يوجد طلب آخر من نفس المتجر (عميلان)</label>
    <button class="btn s hide" id="b3" style="margin-top:6px;width:100%">إلغاء الطلب الحالي</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card big hide" id="res"><span class="sub">آخر مسافة مسجّلة</span><b id="rd">0</b><span class="sub" id="rm"></span></div>
</section>

<section id="v2" class="hide">
  <div class="chips" id="chips">
    <button class="chip on" data-p="today">اليوم</button><button class="chip" data-p="week">هذا الأسبوع</button><button class="chip" data-p="month">هذا الشهر</button><button class="chip" data-p="all">الكل</button><button class="chip" data-p="custom">فترة مخصصة</button>
  </div>
  <div class="range" id="range"><div><label for="df">من</label><input type="date" id="df"></div><div><label for="dt">إلى</label><input type="date" id="dt"></div></div>
  <div class="stats" id="stats"></div>
  <div class="card"><div class="sub">المسافة لكل طلب / يوم (كم)</div><div class="chart" id="chart"></div></div>
  <div class="card"><div class="tools"><button class="btn s" id="csv" style="color:var(--pr)">⬇ تصدير CSV</button><button class="btn s" id="clr">🗑 مسح سجلي</button></div><div id="list"></div></div>
</section>

<section id="v3" class="hide">
  <div class="chips" id="lchips">
    <button class="chip" data-p="today">اليوم</button><button class="chip" data-p="week">الأسبوع</button><button class="chip on" data-p="month">الشهر</button><button class="chip" data-p="all">الكل</button>
  </div>
  <div class="sub" style="margin-bottom:8px">ترى ترتيب الجميع، وأرقام الطلبات والكيلومترات تظهر لك لمن منحتك الإدارة صلاحية رؤيتهم فقط 🔒</div>
  <div class="card" id="lb"></div>
</section>

<section id="v4" class="hide">
  <div class="chips" id="achips">
    <button class="chip" data-p="today">اليوم</button><button class="chip" data-p="week">الأسبوع</button><button class="chip on" data-p="month">الشهر</button><button class="chip" data-p="all">الكل</button>
  </div>
  <div id="adm"></div>
</section>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
/* ===== الإعدادات: ضع مفتاح Publishable هنا (وليس المفتاح السري) ===== */
var SUPABASE_URL='https://gttknezegiufgjzitgxk.supabase.co';
var SUPABASE_KEY='sb_publishable_VnhzPA8HsPxIw_TxLu-H4w_hUGmRZMJ';
/* ================================================================== */
if(/[^\x20-\x7E]/.test(SUPABASE_KEY)){document.body.innerHTML='<div style="padding:24px;font-family:sans-serif;direction:rtl;text-align:center;line-height:1.8"><h2>⚠ لم يتم وضع مفتاح Supabase</h2><p>افتح ملف index.html وضع مفتاح Publishable مكان النص العربي في السطر SUPABASE_KEY.</p></div>';return}
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var me=null,profile=null,orders=[],pending=null,period='today',lper='month',signup=false;

/* ---------- الدخول ---------- */
function am(t,c){var m=$('am');m.textContent=t;m.className='msg '+(c||'')}
function mail(u){return u.toLowerCase()+'@mandoub.app'}
$('sw').onclick=function(){signup=!signup;$('nmBox').classList.toggle('hide',!signup);$('go').textContent=signup?'إنشاء الحساب':'تسجيل الدخول';this.textContent=signup?'لدي حساب – تسجيل الدخول':'ليس لدي حساب – إنشاء حساب جديد';am('')};
$('go').onclick=async function(){
  var u=$('un').value.trim().toLowerCase(),p=$('pw').value,n=$('nm').value.trim();
  if(!/^[a-z0-9_]{3,20}$/.test(u))return am('اسم المستخدم: ٣–٢٠ حرفاً إنجليزياً أو أرقاماً أو _','err');
  if(p.length<6)return am('كلمة المرور قصيرة (٦ أحرف على الأقل)','err');
  if(signup&&!n)return am('اكتب الاسم الظاهر','err');
  this.disabled=true;am('');
  try{
    if(signup){
      var r=await sb.auth.signUp({email:mail(u),password:p});
      if(r.error)throw r.error;
      if(!r.data.session)throw new Error('confirm');
      var q=await sb.from('profiles').insert({id:r.data.user.id,username:u,display_name:n});
      if(q.error)throw q.error;
    }else{
      var r2=await sb.auth.signInWithPassword({email:mail(u),password:p});
      if(r2.error)throw r2.error;
    }
    await boot();
  }catch(e){
    var s=String(e.message||e);
    am(s==='confirm'?'فعّل خيار تعطيل Confirm email في إعدادات Supabase Auth':/already|registered/i.test(s)?'اسم المستخدم مستخدم، اختر اسماً آخر':/Invalid login/i.test(s)?'اسم المستخدم أو كلمة المرور غير صحيحة':'خطأ: '+s,'err');
  }
  this.disabled=false;
};
$('out').onclick=async function(){await sb.auth.signOut();location.reload()};

async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){$('auth').classList.remove('hide');$('app').classList.add('hide');return}
  me=s.data.session.user;
  var p=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
  profile=p.data||{display_name:me.email.split('@')[0],username:''};
  if(profile.active===false){await sb.auth.signOut();$('auth').classList.remove('hide');$('app').classList.add('hide');am('هذا الحساب موقوف. تواصل مع الإدارة.','err');return}
  $('t4').classList.toggle('hide',!profile.is_admin);
  $('who').textContent='مرحباً '+profile.display_name+(profile.is_admin?' (مدير)':'');
  try{pending=JSON.parse(localStorage.getItem('dl_pending_'+me.id))}catch(e){pending=null}
  $('auth').classList.add('hide');$('app').classList.remove('hide');
  ui();await loadOrders();
}
async function loadOrders(){
  var r=await sb.from('orders').select('*').order('t_end',{ascending:false}).limit(2000);
  orders=(r.data||[]).map(function(o){return{id:o.id,restaurant:o.restaurant||'—',rLat:o.r_lat,rLng:o.r_lng,cLat:o.c_lat,cLng:o.c_lng,km:o.km,tStart:new Date(o.t_start).getTime(),tEnd:new Date(o.t_end).getTime()}});
  render();
}
function setPending(v){pending=v;try{if(v)localStorage.setItem('dl_pending_'+me.id,JSON.stringify(v));else localStorage.removeItem('dl_pending_'+me.id)}catch(e){}}

/* ---------- الموقع والمسافة ---------- */
function pos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej({code:0});
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)})},rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
})}
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function fmt(km){return km<1?Math.round(km*1000)+' م':km.toFixed(2)+' كم'}
function say(t,c){var m=$('msg');m.textContent=t;m.className='msg '+(c||'')}
function err(e){say(e.code===1?'تم رفض إذن الموقع. فعّله للمتصفح ثم أعد المحاولة.':e.code===3?'انتهت مهلة تحديد الموقع، جرّب في مكان مكشوف.':'تعذّر تحديد الموقع: '+(e.message||''),'err')}
function lock(b,on,t){b.disabled=on;if(t)b.textContent=t}
function lab(i){return pending.n===2?'🏠 وصلت للعميل '+(i+1):'🏠 وصلت للعميل – احسب المسافة'}
function ui(){
  if(pending&&!pending.done){pending.n=pending.n||1;pending.done=[null,null]}
  var p=!!pending,two=p&&pending.n===2,dn=p?pending.done.filter(function(x){return x!=null}).length:0;
  $('rnBox').classList.toggle('hide',p);$('b1').classList.toggle('hide',p);$('b2').classList.toggle('hide',!p);$('b2b').classList.toggle('hide',!two);$('b3').classList.toggle('hide',!p);
  $('twoBox').classList.toggle('hide',dn>0);
  if(p){$('two').checked=two;['b2','b2b'].forEach(function(id,i){var d=pending.done[i];$(id).disabled=d!=null;$(id).textContent=d!=null?'✔ العميل '+(i+1)+' – '+fmt(d):lab(i)})}
  $('s1').className='step '+(p?'done':'cur');$('s2').className='step '+(p?'cur':'');$('s3').className='step';
  if(p)say('تم حفظ موقع المطعم'+(pending.name?' ('+pending.name+')':'')+(two?'. اضغط زر كل عميل عند وصولك إليه.':'. اضغط الزر الثاني عند وصولك للعميل.'),'ok');else say('');
}
$('two').onchange=function(){if(pending&&pending.done.every(function(x){return x==null})){pending.n=this.checked?2:1;setPending(pending);ui()}};
$('b1').onclick=function(){var b=this;lock(b,true,'جارٍ تحديد الموقع…');say('');
  pos().then(function(p){setPending({name:$('rn').value.trim(),lat:p.lat,lng:p.lng,acc:p.acc,t:Date.now(),n:$('two').checked?2:1,done:[null,null]});$('rn').value='';$('res').classList.add('hide');ui()}).catch(err).then(function(){lock(b,false,'📍 وصلت للمطعم – حدد موقعي')})};
function cust(i){return function(){var b=this;lock(b,true,'جارٍ حساب المسافة…');
  pos().then(async function(p){
    var km=hav(pending,p),end=Date.now();
    var r=await sb.from('orders').insert({restaurant:pending.name||null,r_lat:pending.lat,r_lng:pending.lng,c_lat:p.lat,c_lng:p.lng,km:km,t_start:new Date(pending.t).toISOString(),t_end:new Date(end).toISOString(),acc:Math.max(pending.acc,p.acc)});
    if(r.error)throw r.error;
    pending.done[i]=km;
    var ds=pending.done.slice(0,pending.n);
    if(ds.every(function(x){return x!=null})){
      var mins=Math.max(1,Math.round((end-pending.t)/60000));
      setPending(null);ui();$('two').checked=false;
      $('s1').className='step done';$('s2').className='step done';$('s3').className='step done';
      $('rd').style.fontSize=ds.length>1?'28px':'';$('rd').textContent=ds.map(fmt).join(' · ');
      $('rm').textContent=(ds.length>1?'العميل ١ · العميل ٢ — ':'')+'مدة التوصيل: '+mins+' دقيقة';$('res').classList.remove('hide');
      say(ds.length>1?'تم حفظ الطلبين في السجل ✔':'تم حفظ الطلب في السجل ✔','ok');
    }else{setPending(pending);ui();say('تم حفظ الطلب الأول ✔ — اضغط زر العميل الآخر عند وصولك إليه.','ok')}
    loadOrders();
  }).catch(err).then(function(){b.disabled=false;if(pending)ui()})}}
$('b2').onclick=cust(0);$('b2b').onclick=cust(1);
$('b3').onclick=function(){setPending(null);$('two').checked=false;ui()};

/* ---------- السجل ---------- */
function startOf(p){var n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='week'){s.setDate(s.getDate()-(s.getDay()+1)%7);return s.getTime()}
  if(p==='month')return new Date(n.getFullYear(),n.getMonth(),1).getTime();
  if(p==='today')return s.getTime();return 0}
function range(){var e=Date.now()+1;
  if(period==='custom'){var a=$('df').value,b=$('dt').value;return[a?new Date(a+'T00:00:00').getTime():0,b?new Date(b+'T23:59:59').getTime():e]}
  return[startOf(period),e]}
function filtered(){var r=range();return orders.filter(function(o){return o.tEnd>=r[0]&&o.tEnd<=r[1]})}
function dkey(t){return new Date(t).toLocaleDateString('ar-SA',{day:'numeric',month:'numeric'})}
function render(){
  var f=filtered(),tot=f.reduce(function(a,o){return a+o.km},0),n=f.length,ks=f.map(function(o){return o.km});
  var st=[['عدد الطلبات',n],['إجمالي المسافة',n?fmt(tot):'—'],['المتوسط',n?fmt(tot/n):'—'],['الأبعد / الأقرب',n?fmt(Math.max.apply(0,ks))+' / '+fmt(Math.min.apply(0,ks)):'—']];
  $('stats').innerHTML=st.map(function(s){return'<div class="stat"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'}).join('');
  var g=[];
  if(period==='today'){f.slice().reverse().forEach(function(o){g.push([new Date(o.tEnd).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}),o.km])})}
  else{var m={},ord=[];f.slice().reverse().forEach(function(o){var k=dkey(o.tEnd);if(!(k in m)){m[k]=0;ord.push(k)}m[k]+=o.km});g=ord.slice(-14).map(function(k){return[k,m[k]]})}
  var mx=Math.max.apply(0,g.map(function(x){return x[1]}).concat([0.001]));
  $('chart').innerHTML=g.length?g.map(function(x){return'<div class="col"><em>'+x[1].toFixed(1)+'</em><i style="height:'+Math.max(3,x[1]/mx*85)+'%"></i><small>'+x[0]+'</small></div>'}).join(''):'<div class="empty" style="width:100%">لا توجد بيانات</div>';
  $('list').innerHTML=f.length?f.map(function(o){var d=new Date(o.tEnd);
    return'<div class="row"><div><b>'+esc(o.restaurant)+'</b><div class="m">'+d.toLocaleDateString('ar-SA',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})+' · '+Math.max(1,Math.round((o.tEnd-o.tStart)/60000))+' د</div></div><div class="d">'+fmt(o.km)+'</div><button data-id="'+o.id+'" aria-label="حذف">✕</button></div>'}).join(''):'<div class="empty">لا توجد سجلات في هذه الفترة</div>';
}
$('chips').onclick=function(e){var p=e.target.dataset.p;if(!p)return;period=p;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===e.target)});$('range').classList.toggle('show',p==='custom');render()};
$('df').onchange=$('dt').onchange=render;
$('list').onclick=async function(e){var id=e.target.dataset.id;if(!id||!confirm('حذف هذا السجل؟'))return;await sb.from('orders').delete().eq('id',id);loadOrders()};
$('clr').onclick=async function(){if(orders.length&&confirm('مسح كل سجلاتك نهائياً؟')){await sb.from('orders').delete().eq('user_id',me.id);loadOrders()}};
$('csv').onclick=function(){var f=filtered();if(!f.length)return;
  var L=['المطعم,التاريخ,المسافة (كم),مدة (دقيقة),خط عرض المطعم,خط طول المطعم,خط عرض العميل,خط طول العميل'].concat(f.map(function(o){return[JSON.stringify(o.restaurant),new Date(o.tEnd).toISOString(),o.km.toFixed(3),Math.round((o.tEnd-o.tStart)/60000),o.rLat,o.rLng,o.cLat,o.cLng].join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()};

/* ---------- المنافسة ---------- */
async function loadBoard(){
  $('lb').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  var s=startOf(lper),r=await sb.rpc('leaderboard',{p_from:s?new Date(s).toISOString():null});
  if(r.error){$('lb').innerHTML='<div class="empty">تعذّر التحميل: '+esc(r.error.message)+'</div>';return}
  var d=r.data||[];if(!d.length){$('lb').innerHTML='<div class="empty">لا يوجد مناديب بعد</div>';return}
  var V=d.filter(function(x){return x.can_see}),mo=Math.max.apply(0,V.map(function(x){return x.orders_count}).concat([1])),mk=Math.max.apply(0,V.map(function(x){return x.total_km}).concat([0.001])),med=['🥇','🥈','🥉'];
  $('lb').innerHTML=d.map(function(x){
    var h='<div class="lb'+(x.user_id===me.id?' me':'')+'"><div class="lbh"><span>'+(med[x.rank-1]||x.rank+'.')+' '+esc(x.display_name)+(x.user_id===me.id?' (أنت)':'')+'</span><span>'+(x.can_see?fmt(x.total_km):'🔒')+'</span></div>';
    if(x.can_see)h+='<div class="bar"><span>الطلبات</span><div><i style="width:'+x.orders_count/mo*100+'%;background:var(--ok)"></i></div><b>'+x.orders_count+' طلب</b></div>'
    +'<div class="bar"><span>الكيلومترات</span><div><i style="width:'+x.total_km/mk*100+'%;background:var(--pr)"></i></div><b>'+x.total_km.toFixed(1)+' كم</b></div>';
    return h+'</div>'}).join('');
}
$('lchips').onclick=function(e){var p=e.target.dataset.p;if(!p)return;lper=p;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===e.target)});loadBoard()};

/* ---------- التبويبات ---------- */
/* ---------- لوحة الإدارة ---------- */
var aper='month',AP=[],AC={};
async function loadAdmin(){
  var s=startOf(aper),a=$('adm');a.innerHTML='<div class="card empty">جارٍ التحميل…</div>';
  var R=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('stats_access').select('*'),sb.rpc('leaderboard',{p_from:s?new Date(s).toISOString():null})]);
  if(R[0].error){a.innerHTML='<div class="card empty">'+esc(R[0].error.message)+'</div>';return}
  AP=R[0].data;AC={};(R[1].data||[]).forEach(function(x){(AC[x.viewer_id]=AC[x.viewer_id]||{})[x.target_id]=1});
  var S={},to=0,tk=0;(R[2].data||[]).forEach(function(x){S[x.user_id]=x;to+=x.orders_count;tk+=x.total_km});
  var h='<div class="stats"><div class="stat"><span>المناديب</span><b>'+AP.length+'</b></div><div class="stat"><span>الطلبات</span><b>'+to+'</b></div><div class="stat" style="grid-column:span 2"><span>إجمالي الكيلومترات</span><b>'+tk.toFixed(1)+' كم</b></div></div>';
  h+='<div class="tools" style="margin-bottom:12px"><button class="btn s" data-act="all" style="color:var(--ok)">👁 الكل يرى الكل</button><button class="btn s" data-act="none">🚫 كلٌّ يرى نفسه فقط</button></div>';
  h+=AP.map(function(p){var x=S[p.id]||{orders_count:0,total_km:0};
    var perm=p.is_admin?'<div class="sub">المدير يرى كل الإحصائيات تلقائياً</div>':'<div class="sub" style="margin-bottom:6px">يستطيع رؤية إحصائيات:</div>'+(AP.length>1?AP.filter(function(t){return t.id!==p.id}).map(function(t){return'<label class="ck"><input type="checkbox" data-v="'+p.id+'" data-t="'+t.id+'"'+((AC[p.id]||{})[t.id]?' checked':'')+'> '+esc(t.display_name)+'</label>'}).join(''):'');
    return'<div class="card" data-id="'+p.id+'"><div class="lbh"><span>'+esc(p.display_name)+' <span class="sub">@'+esc(p.username)+'</span> '+(p.is_admin?'<span class="badge">مدير</span>':'')+(p.active?'':'<span class="badge off">موقوف</span>')+'</span><span>'+x.orders_count+' طلب · '+x.total_km.toFixed(1)+' كم</span></div>'
    +'<div class="tools" style="margin:10px 0"><button class="btn s" data-act="ren">✎ الاسم</button><button class="btn s" data-act="rec">📋 السجل</button>'+(p.is_admin?'':'<button class="btn s" data-act="tg">'+(p.active?'⏸ إيقاف':'▶ تفعيل')+'</button>')+'</div>'
    +'<details><summary class="sub" style="cursor:pointer">صلاحيات المشاهدة</summary><div style="margin-top:8px">'+perm+'</div></details><div class="recs"></div></div>'}).join('');
  a.innerHTML=h;
}
function mapLinks(o){
  function ok(a,b){return typeof a==='number'&&typeof b==='number'}
  var G='https://www.google.com/maps',h=[];
  if(ok(o.r_lat,o.r_lng))h.push('<a href="'+G+'?q='+o.r_lat+','+o.r_lng+'" target="_blank" rel="noopener">🏪 المتجر</a>');
  if(ok(o.c_lat,o.c_lng))h.push('<a href="'+G+'?q='+o.c_lat+','+o.c_lng+'" target="_blank" rel="noopener">🏠 العميل</a>');
  if(ok(o.r_lat,o.r_lng)&&ok(o.c_lat,o.c_lng))h.push('<a href="'+G+'/dir/?api=1&origin='+o.r_lat+','+o.r_lng+'&destination='+o.c_lat+','+o.c_lng+'&travelmode=driving" target="_blank" rel="noopener">🧭 المسار</a>');
  return h.length?'<div class="m">'+h.join(' · ')+'</div>':''}
$('adm').onclick=async function(e){
  var act=e.target.dataset.act;if(!act)return;
  var card=e.target.closest('[data-id]'),id=card&&card.dataset.id,p=AP.find(function(x){return x.id===id});
  if(act==='all'){var pr=[];AP.forEach(function(v){if(!v.is_admin)AP.forEach(function(t){if(t.id!==v.id)pr.push({viewer_id:v.id,target_id:t.id})})});if(pr.length)await sb.from('stats_access').upsert(pr);return loadAdmin()}
  if(act==='none'){if(confirm('إلغاء كل صلاحيات المشاهدة؟')){await sb.from('stats_access').delete().not('viewer_id','is',null);loadAdmin()}return}
  if(act==='ren'){var n=prompt('الاسم الجديد',p.display_name);if(n&&n.trim()){await sb.from('profiles').update({display_name:n.trim()}).eq('id',id);loadAdmin()}return}
  if(act==='tg'){if(confirm((p.active?'إيقاف':'تفعيل')+' حساب '+p.display_name+'؟')){await sb.from('profiles').update({active:!p.active}).eq('id',id);loadAdmin()}return}
  if(act==='rec'){var box=card.querySelector('.recs');box.innerHTML='<div class="empty">جارٍ التحميل…</div>';
    var r=await sb.from('orders').select('*').eq('user_id',id).order('t_end',{ascending:false}).limit(50),d=r.data||[];
    box.innerHTML=d.length?d.map(function(o){var t=new Date(o.t_end);return'<div class="row"><div><b>'+esc(o.restaurant||'—')+'</b><div class="m">'+t.toLocaleDateString('ar-SA',{day:'numeric',month:'short'})+' · '+t.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})+'</div>'+mapLinks(o)+'</div><div class="d">'+fmt(o.km)+'</div><button data-act="del" data-oid="'+o.id+'" aria-label="حذف">✕</button></div>'}).join(''):'<div class="empty">لا توجد سجلات</div>';return}
  if(act==='del'&&confirm('حذف هذا الطلب؟')){await sb.from('orders').delete().eq('id',e.target.dataset.oid);e.target.closest('.row').remove()}
};
$('adm').onchange=async function(e){var t=e.target,v=t.dataset.v;if(!v)return;
  var r=t.checked?await sb.from('stats_access').insert({viewer_id:v,target_id:t.dataset.t}):await sb.from('stats_access').delete().eq('viewer_id',v).eq('target_id',t.dataset.t);
  if(r.error){t.checked=!t.checked;alert('تعذّر الحفظ: '+r.error.message)}else{(AC[v]=AC[v]||{});if(t.checked)AC[v][t.dataset.t]=1;else delete AC[v][t.dataset.t]}};
$('achips').onclick=function(e){var p=e.target.dataset.p;if(!p)return;aper=p;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===e.target)});loadAdmin()};

function tab(n){for(var i=1;i<=4;i++){$('v'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)}if(n===2)loadOrders();if(n===3)loadBoard();if(n===4)loadAdmin()}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};$('t3').onclick=function(){tab(3)};$('t4').onclick=function(){tab(4)};

boot().catch(function(){$('auth').classList.remove('hide')});
})();
